<style>
:root{
  --bg:#F4F4F5; --card:#FFFFFF; --ink:#151517; --muted:#5F5E66; --line:#DEDDE2; --sunk:#ECECEF;
  --fx:#C2186D; --fx-soft:#FBE3EF; --dark:#111113;
  --ok:#1E7046; --ok-bg:#DDF0E4; --warn:#8A5300; --warn-bg:#FBEFD2; --bad:#A3271C; --bad-bg:#F8DEDA;

}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:var(--fx)}
button,select,input{font:inherit;color:inherit}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
header{background:var(--dark);color:#F2F2F4;padding:18px 0 14px}
header .eyebrow{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:#FF7AB8;font-weight:700}
header h1{margin:4px 0 2px;font-size:1.45rem;line-height:1.2;font-weight:700}
header p{margin:0;color:#B9B8C0;font-size:.88rem}
.who{background:var(--dark);padding:0 0 14px}
.who label{display:block;color:#B9B8C0;font-size:.8rem;margin-bottom:4px}
.who select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #3A3A40;background:#1E1E22;color:#fff;font-weight:600}
nav{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav button{flex:0 0 auto;border:0;background:none;padding:12px 12px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer}
nav button.on{color:var(--fx);border-bottom-color:var(--fx)}
main{padding:16px 0 60px}
.seg{display:flex;background:var(--sunk);border-radius:10px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:8px 6px;border-radius:8px;font-weight:600;font-size:.86rem;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:none}
.days button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 10px;text-align:center;cursor:pointer;min-width:58px}
.days button b{display:block;font-size:1.05rem}
.days button span{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.days button.on{background:var(--fx);border-color:var(--fx);color:#fff}
.days button.on span{color:#FFE1EF}
.days button i{display:block;width:6px;height:6px;border-radius:50%;margin:3px auto 0;background:transparent}
.days button i.w{background:#E0A100}
.days button.on i.w{background:#FFE08A}
.daytitle{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.daytitle h2{margin:0;font-size:1.3rem}
.pres{font-size:.82rem;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.slot{display:grid;grid-template-columns:78px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.slot:first-child{border-top:0;padding-top:2px}
.slot .sl{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding-top:2px}
.slot .sl .tm{display:block;font-size:.9rem;letter-spacing:0;text-transform:none;color:var(--ink);font-variant-numeric:tabular-nums}
.it{margin-bottom:6px}
.it:last-child{margin-bottom:0}
.it .t{font-weight:700}
.it .d{color:var(--muted);font-size:.88rem}
.it.cont .t{font-weight:600;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.tag{font-size:.74rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.tag.fx{background:var(--fx-soft);color:var(--fx)}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.no{background:var(--bad-bg);color:var(--bad)}
.tag.q{background:var(--warn-bg);color:var(--warn)}
.note{font-size:.84rem;border-radius:8px;padding:7px 10px;margin-top:6px;line-height:1.4}
.note.w{background:var(--warn-bg);color:#5C3A00}
.note.b{background:var(--bad-bg);color:#6E1A12}
.note.i{background:var(--info-bg);color:#1E3560}
.note.c{background:var(--fx-soft);color:#6E0D3E}
.note b{font-weight:700}
.more{border:0;background:none;color:var(--fx);font-weight:600;font-size:.84rem;padding:4px 0 0;cursor:pointer}
.det{font-size:.85rem;color:var(--muted);margin-top:4px;border-left:3px solid var(--line);padding-left:10px}
.det div{margin:2px 0}
.leave{font-size:.84rem;font-weight:600;color:var(--ink);margin-top:4px}
.leave::before{content:"⏰ "}
.empty{color:var(--muted);font-style:italic}
h3{font-size:1.05rem;margin:18px 0 8px}
.lead{color:var(--muted);font-size:.9rem;margin:0 0 12px}
.rv{display:grid;grid-template-columns:28px 1fr;gap:8px}
.rv .n{width:24px;height:24px;border-radius:50%;background:var(--fx);color:#fff;font-size:.78rem;font-weight:700;display:flex;align-items:center;justify-content:center}
.rv .h{font-weight:700}
.rv p{margin:3px 0;font-size:.9rem}
.rv .fix{font-size:.88rem;background:var(--ok-bg);color:#11402A;border-radius:8px;padding:6px 10px;margin-top:6px}
.tblw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;font-size:.8rem;min-width:900px}
th,td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
th{background:var(--sunk);font-weight:700;position:sticky;top:0}
td.rowh{font-weight:700;background:var(--sunk);white-space:nowrap}
td.alc{background:#FFF3D6}
td.out{background:#F0F0F2;color:#9A99A0}
.legend{display:flex;flex-wrap:wrap;gap:8px;font-size:.78rem;color:var(--muted);margin:8px 0}
.kid{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.kid:first-child{border-top:0}
.kid input{width:76px;padding:6px 8px;border:1px solid var(--line);border-radius:8px}
.res{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.res:first-child{border-top:0}
.res select{padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card)}
.btn{display:inline-block;border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;background:var(--fx);color:#fff;text-decoration:none;margin:4px 6px 4px 0}
.btn.sec{background:var(--sunk);color:var(--ink)}
textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:.85rem}
.act{margin-bottom:10px}
.act .t{font-weight:700;font-size:1rem}
.foot{font-size:.78rem;color:var(--muted);margin-top:24px}
@media (min-width:720px){ header h1{font-size:1.8rem} .slot{grid-template-columns:110px 1fr} }
</style>

/* ============ Utilidades ============ */
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function hm(t){ if(!t) return ""; var p=t.split(":"), h=+p[0], m=+p[1]; var ap = h<12 ? "a. m." : "p. m."; var hh=((h+11)%12)+1; return hh+":"+(m<10?"0":"")+m+" "+ap; }
function minus(t,mins){ var p=t.split(":"); var x=(+p[0])*60+(+p[1])-mins; if(x<0) x+=1440; var h=Math.floor(x/60), m=x%60; return (h<10?"0":"")+h+":"+(m<10?"0":"")+m; }
function dayObj(d){ for(var i=0;i<DAYS.length;i++) if(DAYS[i].d===d) return DAYS[i]; }
function presence(f,d){
  if(d<f.inD) return {k:"no", l:"Aún no llegan (llegan el "+f.inD+")"};
  if(d>f.outD) return {k:"no", l:"Ya regresaron a casa"};
  if(d===f.inD) return {k:"in", l:"Hoy llegan"};
  if(d===f.outD) return {k:"out", l:"Hoy salen al aeropuerto"};
  return {k:"si", l:""};
}
function kidVerdict(a, k){
  if(!a) return null;
  if(a.adults) return {v:"no", why:"solo adultos"};
  if(k.age===null) return {v:"q", why:"edad por confirmar"};
  if(a.minAge && k.age<a.minAge) return {v:"no", why:"mín. "+a.minAge+" años"};
  if(a.minH){
    if(k.h===null) return k.age<12 ? {v:"q", why:"medir: piden "+(a.minH/100).toFixed(2).replace(".",",")+" m"} : {v:"si", why:""};
    if(k.h<a.minH) return {v:"q", why:"mide "+k.h+" cm: no entra a todo"};
  }
  return {v:"si", why:""};
}
function walkMins(f){ return hasSmall(f) ? 25 : 15; }

/* Regla del grupo: nada de madrugar o de día completo después de una noche con licor */
function nightAlc(plan,d){ var it=plan[d]||[]; for(var i=0;i<it.length;i++){ var x=it[i]; if(x.alc && (x.s==="cen"||x.s==="noc"||x.s==="mad")) return x; } return null; }
function isEarly(x){ if(!x.a||x.cont) return false; var a=ACT[x.a]; if(a.early) return true; return !!(x.pk && x.at && x.at<"10:00"); }
function ruleWarnings(plan){
  var out={}; // key "d|idx" -> texto
  for(var j=1;j<DAYS.length;j++){
    var d=DAYS[j].d, prev=nightAlc(plan,d-1); if(!prev) continue;
    (plan[d]||[]).forEach(function(x,i){ if(isEarly(x)) out[d+"|"+i] = "La noche anterior hay "+ (ACT[prev.a]?ACT[prev.a].n:prev.t) +" (con licor) y este plan sale a las "+hm(x.at); });
  }
  return out;
}
function dayHasIssue(plan,d){
  var rw=ruleWarnings(plan), it=plan[d]||[];
  for(var i=0;i<it.length;i++){ if(rw[d+"|"+i]) return true; if(plan===JUL && it[i].r && it[i].r[0]!=="i") return true; }
  return false;
}

function itemHTML(x, d, i, f, rw){
  var a = x.a ? ACT[x.a] : null, h = '<div class="it'+(x.cont?" cont":"")+'">';
  h += '<div class="t">'+esc(x.t)+'</div>';
  if(x.d) h += '<div class="d">'+esc(x.d)+'</div>';
  var tags=[];
  if(a && !x.cont){
    if(a.res) tags.push('<span class="tag fx">Requiere reserva</span>');
    if(x.pk) tags.push('<span class="tag">Pick up '+hm(x.at)+'</span>');
  }
  if(x.alc && !x.cont) tags.push('<span class="tag q">Con licor</span>');
  // niños de la familia elegida
  if(f && a && !x.cont && (a.minAge||a.minH)){
    kidsOf(f).forEach(function(k){
      var v=kidVerdict(a,k); if(!v) return;
      var lab = (k.age===null?"Niño/a":"Niño/a de "+k.age)+": ";
      tags.push('<span class="tag '+(v.v==="si"?"ok":v.v==="no"?"no":"q")+'">'+lab+(v.v==="si"?"puede ✓":v.v==="no"?"no puede ("+v.why+")":v.why)+'</span>');
    });
  }
  if(tags.length) h += '<div class="tags">'+tags.join("")+'</div>';
  // hora de salir de la habitación
  if(f && x.at && !x.cont && a && presence(f,d).k!=="no"){
    var w=walkMins(f);
    if(x.pk) h += '<div class="leave">Salgan de la habitación a las '+hm(minus(x.at,15+w))+' (pick up '+hm(x.at)+', hay que estar 15 min antes'+(hasSmall(f)?'; con niños pequeños calculé 25 min a pie':'')+')</div>';
    else if(a.res) h += '<div class="leave">Salgan de la habitación a las '+hm(minus(x.at,w))+' ('+w+' min a pie dentro del hotel)</div>';
  }
  if(f && a && a.alt && !x.cont){
    var anyNo = kidsOf(f).some(function(k){ var v=kidVerdict(a,k); return v && v.v==="no"; });
    if(anyNo) h += '<div class="note i"><b>Para los niños:</b> '+esc(a.alt)+'</div>';
  }
  if(rw[d+"|"+i]) h += '<div class="note b"><b>Ojo:</b> '+esc(rw[d+"|"+i])+'</div>';
  if(S.plan==="jul" && x.r) h += '<div class="note '+(x.r[0]==="b"?"b":x.r[0]==="w"?"w":"i")+'">'+esc(x.r[1])+'</div>';
  if(S.plan==="adj" && x.c) h += '<div class="note c"><b>Cambio:</b> '+esc(x.c)+'</div>';
  if(a && !x.cont){
    var key=d+"|"+i;
    h += '<button class="more" data-more="'+key+'">'+(S.open[key]?"Ocultar detalles":"Horarios, traslado y edades")+'</button>';
    if(S.open[key]) h += '<div class="det"><div><b>Horario:</b> '+esc(a.hours)+'</div><div><b>Cómo se llega:</b> '+esc(a.where)+'</div><div><b>Niños:</b> '+esc(a.kids)+'</div>'+(a.res?'<div><b>Reserva:</b> con Guest Services (formulario del hotel). Cancelar con menos de 24 h: US$25 por persona.</div>':'<div><b>Reserva:</b> no necesita.</div>')+'</div>';
  }
  return h+'</div>';
}

    h += '<h3>Niños de la familia</h3><p class="lead">La estatura importa para Xplor Fuego (1,10 m). Si la anotas, el plan te dice si entra.</p><div class="card">';
    ks.forEach(function(k){
      h += '<div class="kid"><b>Niño/a '+(k.i+1)+'</b><label>Edad <input type="number" min="0" max="17" inputmode="numeric" data-kid="'+k.i+'" data-f="age" value="'+(k.age===null?"":k.age)+'"></label><label>Estatura (cm) <input type="number" min="50" max="200" inputmode="numeric" data-kid="'+k.i+'" data-f="h" value="'+(k.h||"")+'"></label></div>';
    });
    h += '</div>';
  }
  // mensaje
  var wanted = list.filter(function(r){ return st[r.key]==="si"; });
  h += '<h3>Mensaje para Guest Services</h3>';
  if(!wanted.length) h += '<p class="lead">Marca «Vamos» en los planes de arriba y aquí se arma el mensaje para pedir las reservas.</p>';
  else {
    var txt = "Hola, buen día. Quisiera solicitar estas reservas para mi familia (reserva de grupo de Julián Caviedes).\nNombre del titular: ____\n# de confirmación del hotel: ____\n\n";
    wanted.forEach(function(r){
      var a=ACT[r.x.a], pp=peopleFor(f,a);
      txt += "• "+a.n+" — "+WFULL[r.w].toLowerCase()+" "+r.d+" de enero"+(r.x.pk?", pick up "+hm(r.x.at):", "+hm(r.x.at))+" — "+(pp.ad+pp.kids.length)+" personas ("+pp.ad+" adultos"+(pp.kids.length?", niños de "+pp.kids.map(function(k){return k.age===null?"?":k.age;}).join(" y ")+" años":"")+")\n";
    });
    txt += "\nQuedo atento a la confirmación. ¡Gracias!";
    h += '<textarea id="msg">'+esc(txt)+'</textarea><div><button class="btn" id="copy">Copiar mensaje</button><a class="btn sec" href="https://wa.me/?text='+encodeURIComponent(txt)+'" target="_blank" rel="noopener">Abrir en WhatsApp</a></div>';
  }
  return h;
}

function viewInfo(){
  var f=famById(S.fam);
  var h='<p class="lead">Datos del Formulario de Experiencias del hotel, más restricciones de edad y estatura publicadas por Xcaret. Confirmen con el hotel lo marcado «confirmar».</p>';
  ["xcaret","show","xenses","xoxi","catamaran","xplorfuego","xelha","xenotes","arribabaja","teatro","xingao","xupes","buffet"].forEach(function(id){
    var a=ACT[id];
    h += '<div class="card act"><div class="t">'+esc(a.n)+'</div><div class="tags">'+(a.res?'<span class="tag fx">Requiere reserva</span>':'<span class="tag">Sin reserva</span>')+(a.alc?'<span class="tag q">Con licor</span>':'')+(a.minAge?'<span class="tag">Desde '+a.minAge+' años</span>':'')+(a.minH?'<span class="tag">1,10 m</span>':'')+'</div>';
    h += '<div class="det" style="margin-top:8px"><div><b>Horario:</b> '+esc(a.hours)+'</div><div><b>Cómo se llega:</b> '+esc(a.where)+'</div><div><b>Niños:</b> '+esc(a.kids)+'</div></div>';
    if(f){ var tags=kidsOf(f).map(function(k){ var v=kidVerdict(a,k); return '<span class="tag '+(v.v==="si"?"ok":v.v==="no"?"no":"q")+'">'+(k.age===null?"Niño/a":"De "+k.age)+': '+(v.v==="si"?"✓":v.v==="no"?"✗ "+v.why:v.why)+'</span>'; }); if(tags.length) h+='<div class="tags">'+tags.join("")+'</div>'; }
    h += '</div>';
  });
  h += '<p class="foot">Página hecha por Nico para el grupo. Lo que marques se guarda solo en tu celular.</p>';
  return h;
}

function render(){
  renderTabs();
  var v = S.tab==="tabla"?viewTabla(): S.tab==="notas"?viewNotas(): S.tab==="reservas"?viewReservas(): S.tab==="info"?viewInfo(): viewDia();
  document.getElementById("view").innerHTML = v;
  save();
}

/* ============ Eventos ============ */
var sel=document.getElementById("fam");
sel.innerHTML = '<option value="">— Elige tu familia —</option>'+FAMS.map(function(f){ return '<option value="'+f.id+'">'+esc(f.t)+'</option>'; }).join("");
sel.value=S.fam;
sel.addEventListener("change",function(){ S.fam=sel.value; render(); });
document.addEventListener("click",function(e){
  var b=e.target.closest ? e.target.closest("button") : null; if(!b) return;
  if(b.getAttribute("data-tab")){ S.tab=b.getAttribute("data-tab"); render(); window.scrollTo(0,0); }
  else if(b.getAttribute("data-plan")){ S.plan=b.getAttribute("data-plan"); render(); }
  else if(b.getAttribute("data-day")){ S.day=+b.getAttribute("data-day"); render(); }
  else if(b.getAttribute("data-more")){ var k=b.getAttribute("data-more"); S.open[k]=!S.open[k]; render(); }
  else if(b.id==="copy"){ var t=document.getElementById("msg"); t.select();
    var done=function(){ b.textContent="¡Copiado!"; setTimeout(function(){ b.textContent="Copiar mensaje"; },1800); };
    if(navigator.clipboard){ navigator.clipboard.writeText(t.value).then(done,function(){ try{document.execCommand("copy");done();}catch(x){} }); } else { try{document.execCommand("copy");done();}catch(x){} } }
});
document.addEventListener("change",function(e){
  var t=e.target, f=famById(S.fam); if(!f) return;
  if(t.getAttribute("data-res")){ var st=store.get("res_"+f.id,{}); st[t.getAttribute("data-res")]=t.value; store.set("res_"+f.id,st); render(); }
  else if(t.getAttribute("data-kid")!==null){ var ov=store.get("kids_"+f.id,{}), i=t.getAttribute("data-kid"); ov[i]=ov[i]||{}; ov[i][t.getAttribute("data-f")]=t.value; store.set("kids_"+f.id,ov); render(); }
});
if(DAYS.every(function(o){return o.d!==S.day;})) S.day=10;
render();
</script>
